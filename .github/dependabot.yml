# Keeps the GitHub Actions used by the workflows up to date.
#
# Library submodules are deliberately not managed here: Dependabot's
# gitsubmodule updater follows branch heads, but each library is pinned to a
# release tag and bumped by hand (see README.md, "Updating a library").
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all action updates instead of one per action.
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
