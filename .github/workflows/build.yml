# Builds libraries for every target and uploads one artifact per target,
# holding one archive per packaged library.
# Called by ci.yml (pull requests: everything) and release.yml (tags: one
# library); not run on its own.
name: build

on:
  workflow_call:
    secrets:
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      R2_ENDPOINT:
        required: false
    inputs:
      libraries:
        description: Libraries to build, in order. SDL has to come first.
        type: string
        default: SDL SDL_image SDL_ttf SDL_mixer SDL_shadercross
      package:
        description: Libraries to package.
        type: string
        default: SDL SDL_image SDL_ttf SDL_mixer SDL_shadercross
      name:
        description: Archive base name (releases pass the tag). Defaults to the library name.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Empty for targets that build directly on the runner.
    container: ${{ matrix.container }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned: the Windows build step hardcodes this image's Visual Studio path.
          - { target: x86_64-windows-msvc, os: windows-2025 }
          # Steam Linux Runtime 3.0 (sniper) SDK: Debian 11, glibc 2.31, so the
          # libraries run on most distros and inside Steam's runtime. It ships
          # the SDL build dependencies and the toolchain.
          - {
              target: x86_64-linux-gnu,
              os: ubuntu-latest,
              container: "registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest",
            }
          - { target: aarch64-macos, os: macos-latest }

    steps:
      - uses: actions/checkout@v7
        with:
          # Top-level submodules only. The build scripts fetch the nested ones they need.
          submodules: true

      # The checkout belongs to a different user than the container's root, so
      # Git refuses to work in it. The build scripts run git to fetch nested
      # submodules.
      - name: Trust the checkout (Linux container)
        if: runner.os == 'Linux'
        run: git config --global --add safe.directory '*'

      # sccache, so unchanged sources (above all DXC, built from source on
      # Linux and macOS) are not recompiled on every run. Each object file is
      # its own entry in a Cloudflare R2 bucket, keyed on its preprocessed
      # source, compiler and flags, so a bump of one library still reuses the
      # rest, and every branch, pull request and tag shares one cache. CMake
      # picks the launcher up from CMAKE_<LANG>_COMPILER_LAUNCHER in the
      # environment, so the build scripts stay unchanged.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0

      # Runs without secrets (pull requests from forks) build without the cache.
      - name: Use sccache
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "::notice::No R2 credentials; building without sccache."
            exit 0
          fi
          {
            echo "SCCACHE_BUCKET=$R2_BUCKET"
            echo "SCCACHE_ENDPOINT=$R2_ENDPOINT"
            echo "SCCACHE_REGION=auto"
            echo "AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY"
            echo "CMAKE_C_COMPILER_LAUNCHER=sccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
            # A cache hit mostly waits on the network, so run twice as many
            # compiles as there are CPUs. Not more: an uncached DXC build
            # needs a lot of memory, and the macOS runner has only 7 GB.
            echo "CMAKE_BUILD_PARALLEL_LEVEL=$(( $(getconf _NPROCESSORS_ONLN 2>/dev/null || echo "$NUMBER_OF_PROCESSORS") * 2 ))"
          } >> "$GITHUB_ENV"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          for %%L in (${{ inputs.libraries }}) do call %%L\build-${{ matrix.target }}.cmd || exit /b 1

      - name: Build
        if: runner.os != 'Windows'
        run: |
          for lib in ${{ inputs.libraries }}; do
            ./$lib/build-${{ matrix.target }}.sh
          done

      - name: Package
        shell: bash
        run: |
          name='${{ inputs.name }}'
          for lib in ${{ inputs.package }}; do
            cmake -DTARGET=${{ matrix.target }} -DLIB=$lib "-DNAME=${name:-$lib}" -P cmake/package.cmake
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
