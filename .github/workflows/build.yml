# Builds every target and uploads one artifact per target.
# Called by ci.yml (pull requests) and release.yml (tags); not run on its own.
name: build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Empty for targets that build directly on the runner.
    container: ${{ matrix.container }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned: the Windows build step hardcodes this image's Visual Studio path.
          - { target: x86_64-windows-msvc, os: windows-2025 }
          # Steam Linux Runtime 3.0 (sniper) SDK: Debian 11, glibc 2.31, so the
          # libraries run on most distros and inside Steam's runtime. It ships
          # the SDL build dependencies and the toolchain.
          - { target: x86_64-linux-gnu,    os: ubuntu-latest, container: 'registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest' }
          - { target: aarch64-macos,       os: macos-latest }

    steps:
      - uses: actions/checkout@v4
        with:
          # Top-level submodules only. The build scripts fetch the nested ones they need.
          submodules: true

      # The checkout belongs to a different user than the container's root, so
      # Git refuses to work in it. The build scripts run git to fetch nested
      # submodules.
      - name: Trust the checkout (Linux container)
        if: runner.os == 'Linux'
        run: git config --global --add safe.directory '*'

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        # The .cmd scripts expect an x64 MSVC environment. This is Visual
        # Studio 2026 (version 18) on the windows-2025 image.
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          call build-${{ matrix.target }}.cmd

      - name: Build
        if: runner.os != 'Windows'
        run: ./build-${{ matrix.target }}.sh

      - name: Package
        run: cmake -DTARGET=${{ matrix.target }} -P cmake/package.cmake

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
